name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_26.5.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.5.app
          elif [[ -d /Applications/Xcode_26.5.0.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.5.0.app
          elif [[ -d /Applications/Xcode_26.5_beta.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.5_beta.app
          elif [[ -d /Applications/Xcode_26.3.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          fi
          xcodebuild -version
          sw_vers

      - name: Run CI checks
        run: ./scripts/ci-check.sh
